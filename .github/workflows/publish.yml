name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public
